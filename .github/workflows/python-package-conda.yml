name: Python Package

on: [push]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Lint with flake8
        run: |
          uvx --python 3.11 flake8 . --exclude=.git,.venv --count --select=E9,F63,F7,F82 --show-source --statistics
          uvx --python 3.11 flake8 . --exclude=.git,.venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: .venv/bin/python -m pytest
